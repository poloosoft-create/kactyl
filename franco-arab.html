  <style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { overflow-x:hidden; max-width:100%; }
button { cursor:pointer; font-family:inherit; border:none; background:none; }

:root {
  --red:     #E8353A;
  --indigo:  #6366F1;
  --purple:  #7C3AED;
  --blue:    #3B82F6;
  --green:   #059669;
  --bg:      #EDF0F8;
  --surface: #FFFFFF;
  --border:  #DDE3EE;
  --shadow:  rgba(15,23,42,.07);
  --nav:     #0F172A;
  --text:    #1E293B;
  --muted:   #64748B;
  --key-bg:  rgba(255,255,255,.88);
  --key-b:   rgba(195,210,238,.80);
  --key-sh:  rgba(145,170,220,.65);
  --key-h:   #EEF2FF;
  --r: 16px; --rs: 10px;
}
[data-theme="dark"] {
  --bg: #0F172A; --surface: #1E293B; --border: #334155; --shadow: rgba(0,0,0,.22);
  --text: #F1F5F9; --muted: #94A3B8;
  --key-bg: rgba(255,255,255,.07); --key-b: #3D526A; --key-sh: rgba(0,0,0,.30); --key-h: #1E1B4B;
}

body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x: clip; }

/* HEADER */
header {
  background:var(--nav);
  height:64px; padding:0 24px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:300;
}
.logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
.logo-ic { width:36px; height:36px; background:var(--red); border-radius:9px; display:flex; align-items:center; justify-content:center; }
.logo-ic svg { width:22px; height:22px; }
.logo-name { font-size:16px; font-weight:800; color:#fff; letter-spacing:-.3px; }
.logo-name .ar { font-family:'Tajawal',sans-serif; background:var(--red); color:#fff; font-size:10px; padding:1px 7px; border-radius:10px; margin:0 3px; vertical-align:middle; }
.back-link { font-size:13px; font-weight:600; color:#94A3B8; text-decoration:none; display:flex; align-items:center; gap:6px; transition:color .2s; }
.back-link:hover { color:#fff; }

/* MAIN */
main { padding:32px 16px 64px; }
.wrap { max-width:860px; margin:0 auto; }

/* HERO */
.hero-hd { text-align:center; margin-bottom:24px; }
.hero-hd .badge {
  display:inline-block; background:rgba(99,102,241,.1); color:var(--indigo);
  font-size:11px; font-weight:700; padding:4px 14px; border-radius:20px;
  letter-spacing:.5px; text-transform:uppercase; margin-bottom:12px;
}
.hero-hd h1 { font-size:clamp(22px,4vw,36px); font-weight:800; color:var(--text); letter-spacing:-.5px; line-height:1.2; margin-bottom:10px; }
.hero-hd h1 .red { color:var(--red); }
.hero-hd p { font-size:15px; color:var(--muted); max-width:560px; margin:0 auto; line-height:1.6; }

/* CARD */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:0 4px 20px var(--shadow); margin-bottom:14px; }
.editor-card { padding:16px; }

#arabic-text {
  width:100%; min-height:130px;
  border:1.5px solid var(--border); border-radius:var(--rs);

  resize:vertical; outline:none; transition:border-color .2s;
}
#arabic-text:focus { border-color:var(--indigo); }
#arabic-text::placeholder { color:var(--muted); font-size:15px; }

.editor-bar { display:flex; align-items:center; justify-content:space-between; margin-top:12px; flex-wrap:wrap; gap:8px; }
.bar-stats { font-size:13px; color:var(--muted); display:flex; gap:12px; }
.bar-stats b { color:var(--indigo); font-weight:700; }
.bar-btns { display:flex; gap:8px; }
.t-btn {
  display:flex; align-items:center; gap:6px; padding:7px 16px; border-radius:50px;
  border:1.5px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:600; transition:all .2s; box-shadow:0 2px 6px var(--shadow);
}
.t-btn:active { transform:translateY(1px); }
.t-cp       { color:#6B7280; }
.t-cp:hover { border-color:#6B7280; background:#F9FAFB; }

.t-clr:hover{ border-color:#EF4444; background:#FEF2F2; }

.t-dl:hover { border-color:var(--blue); background:#EFF6FF; }

/* KEYBOARD */
.kb-card { padding:14px 16px 16px; }
.kb-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }

.franco-status {
  display:flex; align-items:center; gap:8px;

  border-radius:50px; padding:6px 14px; font-size:13px; font-weight:600; color:#16a34a;
}
.franco-status .dot { width:8px; height:8px; background:#34C759; border-radius:50%; animation:pulse 1.2s infinite; }

.mic-btn {
  width:38px; height:38px; border-radius:50%; background:var(--bg);
  border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
  touch-action: manipulation;
}
.mic-btn img { width:18px; height:18px; }
.mic-btn:hover { background:var(--red); border-color:var(--red); }
.mic-btn:hover img { filter:brightness(0) invert(1); }
.mic-btn.rec { background:var(--red); border-color:var(--red); animation:pulse 1.2s infinite; }
.mic-btn.rec img { filter:brightness(0) invert(1); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* Franco hint */
.franco-hint {
  background:rgba(99,102,241,.06); border:1px solid rgba(99,102,241,.2);
  border-radius:var(--rs); padding:10px 14px; margin-bottom:12px;
  font-size:13px; color:var(--muted); display:flex; align-items:center; flex-wrap:wrap; gap:8px;
}
.franco-chips { display:flex; gap:6px; flex-wrap:wrap; }
.franco-chip {
  background:var(--surface); border:1px solid var(--border); border-radius:50px;

}
.franco-chip:hover { border-color:var(--indigo); color:var(--indigo); }
.fc-latin { color:var(--blue); font-weight:600; }
.fc-arrow { color:var(--muted); font-size:10px; }
.fc-arab { font-family:'Tajawal',sans-serif; color:var(--text); font-size:14px; }

/* KEYBOARD KEYS */
.kb-rows { display:flex; flex-direction:column; gap:7px; }
.kb-row { display:flex; justify-content:center; gap:5px; }
.key {
  min-width:40px; height:52px;
  background:var(--key-bg); border:1px solid var(--key-b);
  border-bottom:3px solid var(--key-sh); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Tajawal',sans-serif; font-size:20px; font-weight:500;
  color:var(--text); position:relative; padding:0 6px;
  transition:all .12s; user-select:none;
}
.key:hover { background:var(--key-h); border-color:#818CF8; }
.key:active { transform:translateY(2px); border-bottom-width:1px; }
.fl { position:absolute; top:3px; left:50%; transform:translateX(-50%); font-family:'Inter',sans-serif; font-size:9px; font-weight:700; color:var(--blue); line-height:1; white-space:nowrap; }
.franco-on .fl { display:block; }

.k-enter, .k-bsp { min-width:52px; font-size:16px; font-family:'Inter',sans-serif; }
.k-slash { min-width:36px; font-size:16px; font-family:'Inter',sans-serif; }
.k-spec { min-width:48px; font-size:11px; font-family:'Inter',sans-serif; line-height:1.2; }
.k-space { min-width:160px; font-size:15px; font-family:'Tajawal',sans-serif; }
.k-dot { min-width:36px; }
.k-franco {
  min-width:72px; font-size:12px; font-weight:700; font-family:'Inter',sans-serif;
  background:var(--blue); color:#fff; border-color:var(--blue);
  border-bottom-color:#1D4ED8;
}
.k-franco.active { background:#34C759; border-color:#34C759; border-bottom-color:#15803D; }
.k-franco .ks { display:block; font-size:9px; font-weight:500; opacity:.8; font-family:'Tajawal',sans-serif; }
.k-tashkeel { min-width:72px; font-size:11px; font-family:'Inter',sans-serif; background:var(--purple); color:#fff; border-color:var(--purple); border-bottom-color:#5B21B6; }
.k-tashkeel .ks { display:block; font-size:9px; font-family:'Tajawal',sans-serif; }
.k-emoji { min-width:44px; font-size:20px; }
.k-123 { min-width:48px; font-size:13px; font-family:'Inter',sans-serif; font-weight:700; }

.t-popup, .e-popup {

/* Toast */
.toast {

.info-sec { padding:48px 16px; }

/* ── THEME ── */
let isDark = false;
function toggleTheme() {
  isDark = !isDark; applyTheme();
  localStorage.setItem('arabi-theme', isDark ? 'dark' : 'light');
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
  const tr = document.getElementById('tt');
  const th = document.getElementById('th');
  const lb = document.getElementById('tlbl');
  if (tr) tr.classList.toggle('on', isDark);
  if (th) th.classList.toggle('on', isDark);
  if (lb) lb.innerHTML = isDark ? 'Dark<br>Mode' : 'White<br>Mode';
}
function loadTheme() {
  isDark = localStorage.getItem('arabi-theme') === 'dark';
  applyTheme();
}

/* ── ARABIZI → ARABIC ── */
function arabiziToArabic(word) {
  const map = [
    ['inchallah','إن شاء الله'],['inch','إن شاء'],
    ['allah','الله'],['bismillah','بسم الله'],
    ['hamdullah','الحمد لله'],['7amdullah','الحمد لله'],
    ['marhaba','مرحبا'],['marhab','مرحبا'],
    ['chokran','شكراً'],['shokran','شكراً'],['chkran','شكراً'],
    ['salam','سلام'],['salamo','سلامو'],
    ['kifak','كيفك'],['kifek','كيفك'],['kif','كيف'],
    ['wesh','واش'],['wach','واش'],
    ['7abibi','حبيبي'],['habibi','حبيبي'],
    ['yallah','يلا'],['yalla','يلا'],
    ['khoya','خويا'],['khouya','خويا'],
    ['sahbi','صاحبي'],['sa7bi','صاحبي'],
    ['bzaf','بزاف'],['bezzaf','بزاف'],
    ['chwiya','شوية'],['chwiya','شوية'],
    ['mabsout','مبسوط'],['mabsouta','مبسوطة'],
    ['ya3ni','يعني'],['ya3ny','يعني'],
    ['3ayb','عيب'],['3eib','عيب'],
    ['9al','قال'],['9allek','قالك'],
    ['kayen','كاين'],['kanch','كانش'],
    ['rabi','ربي'],['rabbi','ربي'],
    ['baraka','بركة'],
    ['2ana','أنا'],['ana','أنا'],
    ['nta','نتا'],['nti','نتي'],
  ];
  const lower = word.toLowerCase();
  for (const [fr, ar] of map) {
    if (lower === fr) return ar;
  }
  // Letter-by-letter fallback
  const letterMap = {
    'a':'ا','b':'ب','t':'ت','th':'ث','j':'ج','7':'ح','kh':'خ',
    'd':'د','r':'ر','z':'ز','s':'س','sh':'ش','9':'ق',
    'f':'ف','gh':'غ','k':'ك','l':'ل','m':'م','n':'ن',
    'h':'ه','w':'و','y':'ي','3':'ع','2':'ء','q':'ق',
    'ch':'ش','ss':'ص','tt':'ط',
  };
  let result = '', i = 0;
  while (i < lower.length) {
    let matched = false;
    for (const [lat, ar] of Object.entries(letterMap).sort((a,b)=>b[0].length-a[0].length)) {
      if (lower.startsWith(lat, i)) { result += ar; i += lat.length; matched = true; break; }
    }
    if (!matched) { result += lower[i]; i++; }
  }
  return result || word;
}

/* ── STATE ── */
let francoOn = true;
let emojiOpen = false, tashOpen = false;
let isRec = false, recog = null;

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', () => {
  buildKB(); buildTash(); buildEmoji(); buildChips(); buildExamples();
  setupPhys(); loadTheme();

  document.getElementById('arabic-text').addEventListener('keydown', function(e) {
    if (!francoOn) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    const ta = this;
    const pos = ta.selectionStart;
    const before = ta.value.slice(0, pos);
    const after  = ta.value.slice(pos);
    const lastBreak = Math.max(before.lastIndexOf(' '), before.lastIndexOf('\n'));
    const lastWord  = before.slice(lastBreak + 1);
    if (!lastWord) return;
    const converted = arabiziToArabic(lastWord);
    if (converted === lastWord) return;
    const newBefore = before.slice(0, lastBreak + 1) + converted;
    e.preventDefault();
    const sep = e.key === 'Enter' ? '\n' : ' ';
    ta.value = newBefore + sep + after;
    ta.selectionStart = ta.selectionEnd = newBefore.length + sep.length;
    updateStats();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#epop') && !e.target.closest('.k-emoji')) closeEmoji();
    if (!e.target.closest('#tpop') && !e.target.closest('.k-tashkeel')) closeTashkeel();
  });
});

function buildKB() {
  const wrap = document.getElementById('kbrows');
  wrap.innerHTML = '';
  document.getElementById('kbc').classList.toggle('franco-on', francoOn);

  ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key';
      if (k === 'ENTER') {
        btn.classList.add('k-enter'); btn.innerHTML = '<svg width="16" height="13" viewBox="0 0 16 13" fill="currentColor"><path d="M14 0v6H4.4l2.3-2.3-1.4-1.4L1 7l4.3 4.3 1.4-1.4L4.4 7.5H16V0h-2z"/></svg>'; btn.onclick = () => ins('\n');
      } else if (k === 'BSP') {
        btn.classList.add('k-bsp'); btn.innerHTML = '<svg width="19" height="14" viewBox="0 0 19 14" fill="currentColor"><path d="M7 0L0 7l7 7h12V0H7zm5.7 9.3l-1.4 1.4L9 8.4l-2.3 2.3-1.4-1.4L7.6 7 5.3 4.7l1.4-1.4L9 5.6l2.3-2.3 1.4 1.4L10.4 7l2.3 2.3z"/></svg>'; btn.onclick = bsp;
      } else if (k === 'SLASH') {
        btn.classList.add('k-slash'); btn.textContent = '/'; btn.onclick = () => ins('/');
      } else if (k === 'SPACE') {
        btn.classList.add('k-space'); btn.innerHTML = '<span style="font-family:Tajawal">مسافة</span>'; btn.onclick = () => ins(' ');
      } else if (k === 'DOT') {
        btn.classList.add('k-dot'); btn.textContent = '.'; btn.onclick = () => ins('.');
      } else if (k === 'EMOJI') {
        btn.classList.add('k-emoji'); btn.textContent = '😊'; btn.onclick = e => { e.stopPropagation(); toggleEmoji(); };
      } else if (k === 'TASHKEEL') {
        btn.classList.add('k-tashkeel'); btn.innerHTML = '✨ تشكيل<span class="ks">حركات</span>'; btn.onclick = e => { e.stopPropagation(); toggleTash(); };
      } else if (k === 'FRANCO') {
        btn.classList.add('k-franco');
        if (francoOn) btn.classList.add('active');
        btn.innerHTML = `Franco<span class="ks">${francoOn ? 'إيقاف' : 'تفعيل'}</span>`;
        btn.onclick = toggleFranco;
      } else {
        const hint = FL[k] || '';
        btn.innerHTML = `<span class="fl">${hint}</span>${k}`;
        if (k === 'لا') btn.style.fontSize = '15px';
        btn.onclick = () => ins(k);
      }
      rowEl.appendChild(btn);
    });
    wrap.appendChild(rowEl);
  });
}

function buildChips() {
  const c = document.getElementById('franco-chips');
  FRANCO_CHIPS.forEach(({l,a}) => {
    const btn = document.createElement('button');
    btn.className = 'franco-chip';
    btn.innerHTML = `<span class="fc-latin">${l}</span><span class="fc-arrow">→</span><span class="fc-arab">${a}</span>`;
    btn.onclick = () => { const ta=document.getElementById('arabic-text'); ta.value+=(ta.value&&!ta.value.endsWith(' ')?' ':'')+a+' '; updateStats(); toast(l+' → '+a+' ✨'); };
    c.appendChild(btn);
  });
}

function buildExamples() {
  const g = document.getElementById('examples-grid');
  EXAMPLES.forEach(({f,a,fr}) => {

    card.className = 'ex-card';
    card.innerHTML = `<div class="ex-franco">${f}</div><div class="ex-arrow">↓</div><div class="ex-arabic">${a}</div><div class="ex-fr">${fr}</div>`;

    g.appendChild(card);
  });
}

function buildTash() {
  const g = document.getElementById('tgrid'); g.innerHTML = '';
  TASH.forEach(({c,l}) => {
    const b = document.createElement('button'); b.className = 't-key';
    b.innerHTML = `${c}<span class="tl">${l}</span>`; b.onclick = () => ins(c);
    g.appendChild(b);
  });
}

function buildEmoji() {
  const g = document.getElementById('egrid'); g.innerHTML = '';
  EMOJIS.forEach(em => {
    const b = document.createElement('button'); b.className = 'e-key'; b.textContent = em; b.onclick = () => ins(em);
    g.appendChild(b);

function toggleFranco() {
  francoOn = !francoOn; buildKB();
  toast(francoOn ? '🔤 Franco ON — type & press Space to convert' : '⌨️ Franco OFF');
  const ta = document.getElementById('arabic-text');
  ta.placeholder = francoOn
    ? 'Essaye: salam — kifak — 7abibi — wesh rak\nAppuie sur Espace pour convertir en arabe ✨'
    : 'اكتب هنا... أو انقر على الأحرف أدناه ✍️';

function toggleTash()    { tashOpen = !tashOpen; document.getElementById('tpop').classList.toggle('show', tashOpen); if (tashOpen) closeEmoji(); }
function closeTashkeel() { tashOpen = false; document.getElementById('tpop').classList.remove('show'); }
function toggleEmoji()   { emojiOpen = !emojiOpen; document.getElementById('epop').classList.toggle('show', emojiOpen); if (emojiOpen) closeTashkeel(); }
function closeEmoji()    { emojiOpen = false; document.getElementById('epop').classList.remove('show'); }

function ins(ch) {
  const ta = document.getElementById('arabic-text');
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + ch + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + ch.length;
  ta.focus(); updateStats();
}
function bsp() {
  const ta = document.getElementById('arabic-text');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s !== e) { ta.value = ta.value.slice(0,s) + ta.value.slice(e); ta.selectionStart = ta.selectionEnd = s; }
  else if (s > 0) { ta.value = ta.value.slice(0,s-1) + ta.value.slice(s); ta.selectionStart = ta.selectionEnd = s-1; }
  ta.focus(); updateStats();
}
function onInput() { updateStats(); }
function updateStats() {
  const v = document.getElementById('arabic-text').value;
  document.getElementById('cc').textContent = v.length;
  document.getElementById('wc').textContent = v.trim() ? v.trim().split(/\s+/).length : 0;
}
function cpText() {
  const v = document.getElementById('arabic-text').value;
  if (!v.trim()) { toast('No text to copy'); return; }
  navigator.clipboard.writeText(v).then(() => toast('✅ Copied!'));
}
function clrText() {
  const ta = document.getElementById('arabic-text');
  if (!ta.value) return; ta.value = ''; updateStats(); toast('Cleared');
}
function dlText() {
  const v = document.getElementById('arabic-text').value;
  if (!v.trim()) { toast('No text to download'); return; }
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([v],{type:'text/plain;charset=utf-8'})),
    download:'arabic-franco-text.txt'
  });
  a.click(); toast('✅ Downloading...');
}
function setupPhys() {
  document.addEventListener('keydown', e => {
    const ta = document.getElementById('arabic-text');
    if (document.activeElement !== ta || e.ctrlKey || e.metaKey || e.altKey) return;
    const skip = ['Backspace','Delete','Tab','Enter','Arrow','Home','End'];
    if (skip.some(s => e.key.startsWith(s))) return;
    if (francoOn) return;
    const ch = PHYS[e.key?.toLowerCase()];
    if (ch) { e.preventDefault(); ins(ch); }
  });
}
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice not supported — use Chrome'); return; }
  isRec ? stopVoice() : startVoice(SR);
}
function startVoice(SR) {
  recog = new SR(); recog.lang='ar-SA'; recog.continuous=true; recog.interimResults=false;
  recog.onstart  = () => { isRec=true; document.getElementById('micbtn').classList.add('rec'); toast('🎤 Listening... speak Arabic'); };
  recog.onresult = e => { for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) ins(e.results[i][0].transcript); };
  recog.onerror  = e => { toast('Error: '+e.error); stopVoice(); };
  recog.onend    = () => { if(isRec) recog.start(); };
  recog.start();
}
function stopVoice() {
  isRec=false; recog&&recog.stop();
  document.getElementById('micbtn').classList.remove('rec');
  toast('⏹️ Voice stopped');
}
function openFaq(btn) {
  const item = btn.closest('.faq-item');
  const was = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(el => el.classList.remove('open'));
  if (!was) item.classList.add('open');
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Dynamic header — hide on scroll down, show on scroll up
(function() {
  const hdr = document.querySelector('header');
  const getY = () => window.pageYOffset || document.documentElement.scrollTop || 0;
  let lastY = getY();
  document.addEventListener('scroll', function() {
    const y = getY();
    if (y > lastY && y > 10) hdr.classList.add('hdr-hidden');
    else hdr.classList.remove('hdr-hidden');
    lastY = y;
  }, { passive: true });
})();
