[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Edge functions live in the default directory, netlify/edge-functions.
# hijri-today.js fills today's date into /hijri-calendar/ per request, so the
# page stays correct on days the site was not rebuilt. Its route and caching are
# declared inline in the file itself (export const config) — it is GENERATED by
# tools/build_hijri_edge.py from the page's own engine, so do not edit it here
# or by hand.
[edge_functions]
  directory = "netlify/edge-functions"
