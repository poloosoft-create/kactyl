[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Edge functions: Netlify's default directory, netlify/edge-functions - no setting needed.
# hijri-today.js fills today's date into /hijri-calendar/ per request; its route and caching
# are declared inline (export const config). It is GENERATED by tools/build_hijri_edge.py
# from the page's own engine - do not edit it by hand.
# NEVER add an [edge_functions] TABLE here: Netlify reads edge_functions only as a list of
# routes ([[edge_functions]]); the table form failed the whole build on 2026-10-18
# (tools/pre_deploy_audit.py now checks this file).
